name: skill_blender_controler
version: 2.0.0
description: Blender 3D 建模专业助手，通过 MCP (Model Context Protocol) 协议与 Blender 通信，实现模型创建、修改、材质应用、场景管理等操作。当用户需要创建或编辑 3D 模型时触发此技能。
entrypoint: README.md
language: python

# 工具接口说明
# 本技能通过 tools/__init__.py 暴露以下工具函数：
#
#   execute_blender_operation(code, host, port, timeout) -> Dict
#     - 统一入口，执行 Blender Python 代码（bpy 模块）
#     - 自动检测服务状态，自动尝试多种 MCP 消息格式
#     - 返回 {"status","result","message","error"}
#
#   tools/blender_mcp_client_v2.py 内部方法（__init__.py 已导出）:
#     - execute_blender_code(code, host, port, timeout) -> Dict
#     - BlenderMCPClient 类（含 is_running, ensure_running, get_scene_info, clear_scene 等方法）
#
# 通信方式: TCP Socket + line-delimited JSON
# 消息格式: {"type": "execute_code", "params": {"code": "..."}}

# 外部配置项
settings:
  # MCP 服务器配置
  mcp_host:
    type: string
    description: Blender MCP 服务器地址
    required: false
    default: "localhost"

  mcp_port:
    type: integer
    description: Blender MCP 服务器端口
    required: false
    default: 9876

  # 连接配置
  connection_timeout:
    type: integer
    description: 连接超时时间（秒）
    required: false
    default: 10

  # Blender Python 代码执行超时
  execution_timeout:
    type: integer
    description: Blender Python 代码执行超时（秒）
    required: false
    default: 30

  # 渲染配置
  default_resolution_x:
    type: integer
    description: 默认渲染宽度（像素）
    required: false
    default: 1920

  default_resolution_y:
    type: integer
    description: 默认渲染高度（像素）
    required: false
    default: 1080

  default_samples:
    type: integer
    description: 默认渲染采样数（影响质量）
    required: false
    default: 128

  # 连接管理
  auto_reconnect:
    type: boolean
    description: 是否自动重连断开的连接
    required: false
    default: true

